# TRMNL Plugin Configuration for GO Transit Union Departures
# uuid: will be generated by TRMNL
name: GO Transit Union Departures
author: Hossain Khan
author_email: hello@hossain.dev
homepage: https://github.com/hossain-khan/trmnl-go-transit-plugin
description: Real-time GO Transit departure board for Union Station and other stations
markup_version: 1
strategy: merge_tag
refresh_frequency: 300  # 5 minutes in seconds (real-time transit data)

merge_tag:
  - tag_name: trainDepartures
    # External departures endpoint - returns real-time departure board data
    # API response format matches templates: { stationCode, trainDepartures: { items: [...] } }
    source: https://gta-go-transit.gohk.xyz/api/V1/external/departures/{{station_id}}
    merge_object: true

layouts:
  - name: full
    label: Full Screen
    filename: full.liquid
    directory: templates-union-departures
  - name: half_horizontal
    label: Half Horizontal
    filename: half_horizontal.liquid
    directory: templates-union-departures
  - name: half_vertical
    label: Half Vertical
    filename: half_vertical.liquid
    directory: templates-union-departures
  - name: quadrant
    label: Quadrant
    filename: quadrant.liquid
    directory: templates-union-departures
